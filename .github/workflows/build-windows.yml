# Сборка Windows-версии: при пуше в main или вручную (Actions -> Build Windows -> Run workflow).
# Результат - zip в разделе Artifacts у запуска: pixelsortery.exe + DLL FFmpeg (держать в одной папке).
name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_video:
        description: "Собрать БЕЗ поддержки видео (быстрее, без DLL FFmpeg)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Сборка FFmpeg с dev-файлами (include + lib) и DLL - так же, как в CI самого ffmpeg-the-third.
  # ffmpeg-the-third 6.0 поддерживает FFmpeg до 9.0.
  FFMPEG_VERSION: "9.0"
  FFMPEG_DOWNLOAD_URL: "https://github.com/GyanD/codexffmpeg/releases/download/VER/ffmpeg-VER-full_build-shared.7z"
  FFMPEG_INSTALL_PATH: "C:/ffmpeg"
  VIDEO: ${{ inputs.no_video && 'false' || 'true' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-v2-video-${{ env.VIDEO }}-${{ hashFiles('**/Cargo.lock') }}

      # libclang из комплекта Visual Studio: с отдельно установленным LLVM build-скрипт
      # ffmpeg-sys-the-third падает с STATUS_ACCESS_VIOLATION
      - name: Set libclang path
        if: env.VIDEO == 'true'
        shell: pwsh
        run: |
          $VCINSTALLDIR = $(& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath)
          Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=${VCINSTALLDIR}\VC\Tools\LLVM\x64\bin"

      - name: Download FFmpeg
        if: env.VIDEO == 'true'
        shell: pwsh
        run: |
          $tempFile = New-TemporaryFile
          $uri = ($env:FFMPEG_DOWNLOAD_URL).Replace('VER', $env:FFMPEG_VERSION)
          Invoke-WebRequest "$uri" -OutFile "$tempFile"
          7z x -y -o"$env:FFMPEG_INSTALL_PATH" "$tempFile"
          $ffmpegDir = (Get-ChildItem -Directory "$env:FFMPEG_INSTALL_PATH").FullName
          Get-ChildItem $ffmpegDir
          Add-Content $env:GITHUB_ENV "FFMPEG_DIR=$ffmpegDir"
          Add-Content $env:GITHUB_PATH "$ffmpegDir\bin"

      - name: Build
        shell: bash
        run: |
          if [[ "$VIDEO" == "true" ]]; then
            cargo build --release --features video
          else
            cargo build --release
          fi

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\pixelsortery.exe dist\
          if ($env:VIDEO -eq 'true') {
            Copy-Item "$env:FFMPEG_DIR\bin\*.dll" dist\
            Copy-Item "$env:FFMPEG_DIR\bin\ffplay.exe" dist\ -ErrorAction SilentlyContinue
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: pixelsortery-windows${{ env.VIDEO == 'true' && '-video' || '' }}-${{ github.sha }}
          path: dist/
          retention-days: 30
