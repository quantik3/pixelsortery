# Builds the Windows version: on every push to main, or manually (Actions -> Build Windows -> Run workflow).
# Result: a zip in the Artifacts of the run with pixelsortery.exe + the FFmpeg DLLs (keep them in one folder).
name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_video:
        description: "Build WITHOUT video support (faster, no FFmpeg DLLs)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # FFmpeg build with development files (include + lib) and DLLs, the same as in the CI of ffmpeg-the-third itself.
  # ffmpeg-the-third 6.0 supports FFmpeg up to 9.0.
  FFMPEG_VERSION: "9.0"
  FFMPEG_DOWNLOAD_URL: "https://github.com/GyanD/codexffmpeg/releases/download/VER/ffmpeg-VER-full_build-shared.7z"
  FFMPEG_INSTALL_PATH: "C:/ffmpeg"
  VIDEO: ${{ inputs.no_video && 'false' || 'true' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-v2-video-${{ env.VIDEO }}-${{ hashFiles('**/Cargo.lock') }}

      # libclang from Visual Studio: with the separately installed LLVM, the build script
      # of ffmpeg-sys-the-third crashes with STATUS_ACCESS_VIOLATION
      - name: Set libclang path
        if: env.VIDEO == 'true'
        shell: pwsh
        run: |
          $VCINSTALLDIR = $(& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath)
          Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=${VCINSTALLDIR}\VC\Tools\LLVM\x64\bin"

      - name: Download FFmpeg
        if: env.VIDEO == 'true'
        shell: pwsh
        run: |
          $tempFile = New-TemporaryFile
          $uri = ($env:FFMPEG_DOWNLOAD_URL).Replace('VER', $env:FFMPEG_VERSION)
          Invoke-WebRequest "$uri" -OutFile "$tempFile"
          7z x -y -o"$env:FFMPEG_INSTALL_PATH" "$tempFile"
          $ffmpegDir = (Get-ChildItem -Directory "$env:FFMPEG_INSTALL_PATH").FullName
          Get-ChildItem $ffmpegDir
          Add-Content $env:GITHUB_ENV "FFMPEG_DIR=$ffmpegDir"
          Add-Content $env:GITHUB_PATH "$ffmpegDir\bin"

      - name: Build
        shell: bash
        run: |
          if [[ "$VIDEO" == "true" ]]; then
            cargo build --release --features video
          else
            cargo build --release
          fi

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\pixelsortery.exe dist\
          if ($env:VIDEO -eq 'true') {
            Copy-Item "$env:FFMPEG_DIR\bin\*.dll" dist\
            Copy-Item "$env:FFMPEG_DIR\bin\ffplay.exe" dist\ -ErrorAction SilentlyContinue
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v6
        with:
          name: pixelsortery-windows${{ env.VIDEO == 'true' && '-video' || '' }}-${{ github.sha }}
          path: dist/
          retention-days: 30
